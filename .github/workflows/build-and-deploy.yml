name: Build documents and website
on:
  push:
    branches: [master, 'targets/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '@nobuild') }}
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/python-requirement-lists/*.txt
      - name: Install Python dependencies
        run: python -m pip install -r build/python-requirement-lists/general-pkgs.txt -r build/python-requirement-lists/python-minted-pkgs.txt -r build/python-requirement-lists/site-pkgs.txt
      - name: Validate metadata and test build tools
        run: |
          python build/build.py validate
          PYTHONPATH=build python -m unittest discover -s build/tests -v
      - name: Select targets and compilation matrix
        id: plan
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python build/ci-plan.py

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/python-requirement-lists/*.txt
      - name: Install build environment
        run: |
          sudo sh build/bootstrap-ubuntu.sh
          python -m pip install -r build/python-requirement-lists/general-pkgs.txt -r build/python-requirement-lists/python-minted-pkgs.txt -r build/python-requirement-lists/site-pkgs.txt
      - name: Cache MiKTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.miktex
          key: miktex-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/bootstrap-ubuntu.sh', 'build/setup-miktex.sh') }}-${{ hashFiles('src/**/*.tex', 'src/**/*.sty', 'src/**/*.cls', 'src/**/metadata.json') }}
          restore-keys: |
            miktex-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/bootstrap-ubuntu.sh', 'build/setup-miktex.sh') }}-
      - name: Enable MiKTeX on-the-fly package installation
        run: |
          sh build/setup-miktex.sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Configure document
        env:
          TARGET: ${{ matrix.target }}
        run: python configure --targets "$TARGET"
      - name: Restore compiled document and previews
        uses: actions/cache@v4
        with:
          path: dist/artifacts/${{ matrix.target }}
          key: document-v2-${{ runner.os }}-${{ runner.arch }}-py313-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            document-v2-${{ runner.os }}-${{ runner.arch }}-py313-${{ matrix.target }}-
      - name: Build changed document and previews
        # Each runner owns its MiKTeX tree; no concurrent package installations
        # share a writable tree. The runner validates cached source fingerprints.
        env:
          FORCE_REBUILD: ${{ contains(github.event.head_commit.message, '@force-rebuild') && '1' || '0' }}
        run: make FORCE="$FORCE_REBUILD" preview
      - name: Upload document artifacts
        uses: actions/upload-artifact@v4
        with:
          name: document-${{ matrix.target }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.target }}
          path: |
            src/**/*.log
            src/**/.build/state.json
            ~/.miktex/texmfs/data/miktex/log/
          include-hidden-files: true
          retention-days: 7

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/python-requirement-lists/*.txt
      - name: Install website dependencies
        run: python -m pip install -r build/python-requirement-lists/general-pkgs.txt -r build/python-requirement-lists/site-pkgs.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: document-*
          merge-multiple: true
          path: dist/artifacts
      - name: Assemble website from matrix artifacts
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, 'configure', '--no-check', '--targets', *json.loads(os.environ['TARGETS'])], check=True)
          PYCODE
          python build/build.py --config .build/config.json site
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: local-build-output
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload website diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-diagnostics
          path: .build/site/mkdocs.yml
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: assemble
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-build-output
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
        id: deployment

  notify-indexing:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: local-build-output
          path: dist
      - name: Send post-deployment indexing notifications
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_API_JSON_KEY }}
        run: |
          python -m pip install -r build/python-requirement-lists/indexing-pkgs.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          command = [sys.executable, 'build/request_indexing.py', '--indexnow-key', 'build/seo/33fe8f8f94504b19ac2625348c5a31d5.txt']
          with tempfile.TemporaryDirectory() as directory:
              if os.environ.get('GOOGLE_INDEXING_KEY'):
                  key = Path(directory) / 'google.json'
                  key.write_text(os.environ['GOOGLE_INDEXING_KEY'])
                  command.extend(['--google-key', str(key)])
              subprocess.run(command, check=True)
          PY
