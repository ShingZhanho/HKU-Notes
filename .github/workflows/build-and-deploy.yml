name: Build documents and website
on:
  push:
    branches: [master, 'targets/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '@nobuild') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: build/python-requirement-lists/*.txt
      - name: Install build environment
        run: |
          sudo sh build/bootstrap-ubuntu.sh
          python -m pip install -r build/python-requirement-lists/general-pkgs.txt -r build/python-requirement-lists/python-minted-pkgs.txt -r build/python-requirement-lists/site-pkgs.txt
      - name: Validate metadata and test build tools
        run: |
          python build/build.py validate
          PYTHONPATH=build python -m unittest discover -s build/tests -v
      - name: Configure targets
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          branch = os.environ['TARGET_BRANCH'].split('/')
          arguments = ['--targets', branch[1]] if len(branch) >= 3 and branch[0] == 'targets' else []
          subprocess.run([sys.executable, 'configure', *arguments], check=True)
          PY
      - name: Build documents and website
        run: make -j2 site
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: local-build-output
          path: dist/
          retention-days: 7
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            src/**/*.log
            src/**/.build/state.json
            .build/site/mkdocs.yml
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-build-output
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
        id: deployment

  notify-indexing:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: local-build-output
          path: dist
      - name: Send post-deployment indexing notifications
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_API_JSON_KEY }}
        run: |
          python -m pip install -r build/python-requirement-lists/indexing-pkgs.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          command = [sys.executable, 'build/request_indexing.py', '--indexnow-key', 'build/seo/33fe8f8f94504b19ac2625348c5a31d5.txt']
          with tempfile.TemporaryDirectory() as directory:
              if os.environ.get('GOOGLE_INDEXING_KEY'):
                  key = Path(directory) / 'google.json'
                  key.write_text(os.environ['GOOGLE_INDEXING_KEY'])
                  command.extend(['--google-key', str(key)])
              subprocess.run(command, check=True)
          PY
